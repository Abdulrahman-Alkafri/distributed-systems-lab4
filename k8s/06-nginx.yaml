# Nginx = the only way into the cluster from outside.
#
# ConfigMap  -> holds nginx.conf as a file, so we don't rebuild an image to change config
# Secret     -> holds the TLS certificate (created by deploy.sh, NOT stored in git)
# NodePort   -> opens a port on the cluster node so the outside world can reach us

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  nginx.conf: |
    events {}

    http {
      # 10.96.0.10 is the Kubernetes DNS server. Nginx asks it for the Flask pod IPs
      # and re-checks every 5s, so new or restarted pods are picked up automatically.
      resolver 10.96.0.10 valid=5s ipv6=off;

      upstream flask_app {
        zone flask_app 64k;
        random two least_conn;        # pick 2 random pods, send to the one with fewer connections
        # The full DNS name is required: nginx's resolver does NOT add the
        # ".default.svc.cluster.local" suffix the way normal Linux lookups do.
        # This is the headless Service, so DNS returns all 3 Flask pod IPs.
        server flask.default.svc.cluster.local:5000 resolve;
      }

      # port 80 -> redirect everything to HTTPS
      server {
        listen 80;
        return 301 https://$host:30443$request_uri;
      }

      server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
          proxy_pass http://flask_app;
          add_header X-Upstream $upstream_addr;   # shows which pod answered
        }

        # Server-Sent Events: keep the connection open, send each update immediately
        location /stream {
          proxy_pass http://flask_app;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 1h;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf       # mount ONE file, not the whole folder
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits:   { memory: "96Mi" }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
        - name: certs
          secret:
            secretName: nginx-tls
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort          # opens a fixed port on the node, reachable from outside the cluster
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      nodePort: 30080
    - name: https
      port: 443
      nodePort: 30443
